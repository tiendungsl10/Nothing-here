<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đã từng có nội dung ở đây!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --text: #f4f6ff;
    --muted: #9aa4c7;
    --c1: #7c5cff;
    --c2: #22d3ee;
    --c3: #ff6ec7;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6ff; --text: #14183a; --muted: #5a6290; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Nền sáng chuyển động nhẹ */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: .45; z-index: 0;
    will-change: transform;
  }
  .b1 { width: 45vmax; height: 45vmax; background: var(--c1); top: -15vmax; left: -10vmax; animation: float1 18s ease-in-out infinite; }
  .b2 { width: 40vmax; height: 40vmax; background: var(--c2); bottom: -15vmax; right: -10vmax; animation: float2 22s ease-in-out infinite; }
  .b3 { width: 28vmax; height: 28vmax; background: var(--c3); top: 40%; left: 55%; opacity: .25; animation: float1 26s ease-in-out infinite reverse; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(8vmax,6vmax) scale(1.12); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-7vmax,-5vmax) scale(1.1); } }

  main {
    position: relative; z-index: 1;
    text-align: center;
    width: 100%; max-width: 900px;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(14px, 3vh, 26px);
  }

  .title {
    font-size: clamp(2.6rem, 11vw, 7rem);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.02em;
    padding: 0 .1em .08em;
    background: linear-gradient(110deg, var(--c1), var(--c2), var(--c3), var(--c1));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both, shine 7s linear infinite;
  }
  .line {
    width: clamp(60px, 12vw, 110px); height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--c1), var(--c2));
    animation: grow 1s .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .subtitle {
    font-size: clamp(1.15rem, 4vw, 2rem);
    font-weight: 500;
    line-height: 1.4;
    animation: rise .9s .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .note {
    font-size: clamp(.85rem, 2.6vw, 1.05rem);
    font-weight: 300;
    color: var(--muted);
    line-height: 1.6;
    letter-spacing: .02em;
    animation: rise .9s .45s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes shine { to { background-position: 300% 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main>
    <h1 class="title">Trang web tạm dừng hoạt động</h1>
    <div class="line"></div>
    <p class="subtitle">Bạn vẫn có thể truy cập code chính trên github</p>
    <p class="note">- From Trần Lê -</p>
  </main>
</body>
</html>
