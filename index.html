<title>Bữa tiệc sinh nhật</title>
<style>
:root {
  --pk: #FFD6E0;
  --pk2: #FF8FAB;
  --bg: #FFF8F6;
  --ice: #CDEBF5;
  --nv: #2B2D42;
  --or: #FFB38A;
  box-sizing: border-box;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
html,body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--nv);
  font-family: "Baloo 2",Quicksand,Fredoka,"Trebuchet MS",system-ui,sans-serif;
}
body {
  padding-top: env(safe-area-inset-top,0);
  padding-bottom: env(safe-area-inset-bottom,0);
  overflow-x: hidden;
}
#top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: linear-gradient(var(--pk),var(--bg));
}
#dots {
  flex: 1;
  min-width: 70px;
  display: flex;
  gap: 6px;
  justify-content: center;
}
#dots i {
  width: 34px;
  height: 8px;
  border-radius: 9px;
  background: #fff;
  box-shadow: inset 0 0 0 2px var(--pk2);
}
#dots i.on {
  background: var(--pk2);
}
button {
  font: inherit;
  font-weight: 700;
  border: 0;
  border-radius: 18px;
  padding: 10px 18px;
  background: var(--pk2);
  color: #fff;
  box-shadow: 0 4px 0 #e0678a;
  cursor: pointer;
}
button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #e0678a;
}
button.g {
  background: var(--ice);
  color: var(--nv);
  box-shadow: 0 4px 0 #a9cddb;
}
#v {
  max-width: 620px;
  margin: 0 auto;
  padding: 8px 12px 20px;
  text-align: center;
}
h2 {
  margin: 6px 0;
}
.sc {
  position: relative;
  width: 100%;
  aspect-ratio: 4/5;
  max-height: 68vh;
  margin: 8px auto;
  border-radius: 24px;
  overflow: hidden;
  background: linear-gradient(#ffe9ef 60%,#e8c9a8 60%);
  box-shadow: 0 8px 24px #ff8fab55;
}
.sc .d {
  position: absolute;
  transform: translate(-50%,-50%);
  line-height: 1;
}
.it {
  position: absolute;
  transform: translate(-50%,-50%);
  font-size: 26px;
  border: 0;
  background: none;
  box-shadow: none;
  padding: 6px;
  filter: drop-shadow(0 1px 1px #0005);
}
.it.h {
  animation: pl .8s 3;
}
@keyframes pl {50%{transform:translate(-50%,-50%) scale(2.2)}}
.bar {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 6px 0;
}
.sl {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #fff;
  display: grid;
  place-items: center;
  font-size: 22px;
  box-shadow: inset 0 0 0 2px var(--pk);
}
.sl.f {
  background: var(--pk);
}
.md {
  position: fixed;
  inset: 0;
  background: #2b2d4299;
  display: grid;
  place-items: center;
  z-index: 9;
  padding: 14px;
}
.mb {
  background: var(--bg);
  border-radius: 26px;
  padding: 18px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 10px 40px #0006;
  max-height: 92vh;
  overflow: auto;
}
.dial {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  margin: 4px;
}
.dial button {
  padding: 2px 12px;
  border-radius: 10px;
  box-shadow: none;
  background: var(--ice);
  color: var(--nv);
}
.dial b {
  font-size: 30px;
  width: 46px;
  height: 50px;
  display: grid;
  place-items: center;
  background: #fff;
  border-radius: 10px;
  box-shadow: inset 0 0 0 2px var(--pk2);
}
.note {
  background: #fff7c9;
  border-radius: 10px;
  padding: 10px;
  margin: 8px 0;
  transform: rotate(-1.5deg);
  box-shadow: 0 3px 8px #0002;
}
.fr {
  position: relative;
  width: min(80%,300px);
  aspect-ratio: 3/5;
  margin: 8px auto;
  border-radius: 24px;
  background: linear-gradient(90deg,#fff,var(--ice));
  box-shadow: 0 8px 24px #0003,inset 0 0 0 5px #fff;
}
.lk {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 34px;
  background: #fff;
  box-shadow: 0 3px 0 #bbb;
  border-radius: 50%;
  width: 54px;
  height: 54px;
  padding: 0;
  display: grid;
  place-items: center;
}
.lk.ok {
  opacity: .45;
}
.lk.nx {
  animation: pl 1.2s infinite;
}
.sh {
  animation: sh .4s;
}
@keyframes sh {25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
canvas {
  width: 100%;
  height: clamp(300px,60vh,640px);
  border-radius: 24px;
  display: block;
  touch-action: none;
  box-shadow: 0 8px 24px #0004;
}
.pad {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin: 10px;
}
.pad button {
  font-size: 26px;
  width: 92px;
}
.rm {
  position: relative;
  height: 64vh;
  min-height: 430px;
  border-radius: 24px;
  overflow: hidden;
  background: linear-gradient(#ffe0ea 55%,#f2c6a0 55%);
  box-shadow: 0 8px 24px #ff8fab55;
}
.an {
  position: absolute;
  transform: translate(-50%,-50%);
  text-align: center;
  font-size: 54px;
  line-height: 1;
}
.an small {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--nv);
}
.bb {
  position: absolute;
  left: 50%;
  top: 6px;
  transform: translateX(-50%);
  width: 88%;
  background: #fff;
  border-radius: 18px;
  padding: 10px 14px;
  font-size: 17px;
  box-shadow: 0 4px 14px #0003;
  z-index: 3;
}
.cf {
  position: absolute;

function showParty() {
  view.innerHTML = `<div class="rm" id="rm"></div><div id="ft"></div><div id="tb"></div>`;
  const rm = $('#rm');
  const top0 = Math.round(rm.getBoundingClientRect().top);
  rm.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:auto;max-height:none;top:' + top0 + 'px';
  const ch = innerHeight - top0, cw = innerWidth;
  const u = ch / 500, vis = 500 * cw / ch, W = Math.round(Math.max(400, Math.min(2000, vis)));
  window.PW = W;
  window.PV = vis;
  window.PF = Math.min(1, Math.max(.7, vis / 400));
  rm.style.setProperty('--f', Math.min(1, Math.max(.7, vis / 400)));
  rm.style.setProperty('--u', u);
  rm.innerHTML = `<div class="stg" id="stg" style="aspect-ratio:${W}/500">${PARTYBG(W)}${AN.map((a, i) => `<div class="an" id="a${i}" style="left:${(W / 2 + AOFF(vis, a[2])) / W * 100}%;top:${a[3] / 5}%">${a[0]}<small>${a[1]}</small></div>`).join('')}<div id="pgw" style="position:absolute;left:50%;top:98.4%;transform:translate(-50%,-100%)">${PG(Math.round(98 * u), 0, 1)}</div></div>`;
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'cf';
    c.textContent = ['🎈', '🎉', '💖', '✨'][i % 4];
    c.style.cssText = `left:${i * 3.9}%;animation-duration:${6 + i % 5 * 2}s;animation-delay:-${i % 7}s;font-size:${14 + i % 4 * 5}px`;
    rm.appendChild(c);
  }
  let i = 0;
  const say = () => {
    if (gameState.st != 4)
      return;
    document.querySelectorAll('.bb2').forEach(e => e.remove());
    AN.forEach((_, k) => $('#a' + k).style.transform = 'translate(-50%,-100%)');
    if (i >= WISHES.length) {
      $('#tb').innerHTML = '<button id="th">Cảm ơn mọi người 💖</button>';
      $('#th').onclick = cat;
      return;
    }
    const k = i % AN.length, el = $('#a' + k);
    el.style.transform = 'translate(-50%,-100%) scale(1.15)';
    el.insertAdjacentHTML('beforeend', `<div class="bb2">${WISHES[i]}</div>`);
    playTone(700, .1);
    i++;
    setTimeout(say, 3800);
  };
  setTimeout(say, 800);
}

function cat() {
  const A = [], box = $('#ft'), pw = $('#pgw'), ct = $('#a1');

  ct.style.transform = 'translate(-50%,-100%)';

    if (q == 2) {

      const pick = i => { A.push((i ? 'B: ' : 'A: ') + CAT_CH[i]); box.innerHTML = ''; ct.insertAdjacentHTML('beforeend', `<div class="bb2">${i ? 'Puồn :[' : 'Hí hí ツ. Liệu tương lai có còn dừng ở chữ quý?. Tôi cũng chẳng biết nữa...'}</div>`); playTone(i ? 440 : 660, .3, 'triangle', .07); setTimeout(() => send(A), 4000);};
      $('#oa').onclick = () => pick(0);
      $('#ob').onclick = () => pick(1);
      return;
    }
    box.innerHTML = `<div class="mb" style="margin:0 auto"><b>Mèo trắng hỏi (${q + 1}/3):</b><br>${CAT_Q[q]}<input id="in" placeholder="Câu trả lời của bạn..."><button id="ok">Tiếp ▶</button></div>`;
    $('#ok').onclick = () => { const v = $('#in').value.trim(); if (!v)
      return $('#in').classList.add('sh'); A.push(v); q++; ask(); };
  };
  setTimeout(ask, 1900);
}

const escH = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function postHook(payload) {
  let code = 0;
  const js = JSON.stringify(payload);
  try {
    const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: js });
    if (r.ok)
      return { ok: 1 };
    code = r.status;
    if (code != 429 && code < 500)
      return { ok: 0, code };
  }
  catch (e) { }
  try {
    const fd = new FormData();
    fd.append('payload_json', js);
    const r = await fetch(ENDPOINT, { method: 'POST', body: fd });
    if (r.ok)
      return { ok: 1 };
    code = r.status;
    if (code != 429 && code < 500)
      return { ok: 0, code };
  }
  catch (e) { }
  try {
    const fd = new FormData();
    fd.append('payload_json', js);
    await fetch(ENDPOINT, { method: 'POST', body: fd, mode: 'no-cors' });
    return { ok: 1, opaque: 1 };
  }
  catch (e) { }
  return { ok: 0, code };
}

async function send(A) {
  FAN();
  const box = $('#ft');
  const time = new Date().toISOString();
  const payload = { username: 'Mèo trắng', allowed_mentions: { parse: [] }, embeds: [{ title: ('🎂 Phản hồi từ ' + NAME).slice(0, 256), color: 16748459, timestamp: time, footer: { text: 'Bữa tiệc sinh nhật' }, fields: CAT_Q.map((q, i) => ({ name: ('Câu ' + (i + 1) + ': ' + q).slice(0, 256), value: (String(A[i] == null ? '' : A[i]).slice(0, 1000)) || '(trống)' })) }] };
  const close = () => { box.innerHTML = ''; $('#tb').innerHTML = ''; };
  box.innerHTML = `<div class="mb" style="margin:0 auto"><div>${CAT}</div><h3>Cảm ơn ${escH(NAME)}! 💖</h3><p>Cảm ơn ${NAME} đã trả lời. Chúc mừng sinh nhật!</p><div class="sm" style="text-align:left;margin:6px 0">${creditHTML()}</div><button class="g" id="rp">✖ Đóng</button></div>`;
  $('#rp').onclick = close;
  if (ENDPOINT) {
    for (let n = 0; n < 3; n++) {
      const r = await postHook(payload);
      if (r.ok)
        break;
      console.warn('Gửi phản hồi thất bại', r);
      await new Promise(s => setTimeout(s, 2500 * (n + 1)));
    }
  }
}
